<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridStar AI</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("gs-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <link rel="stylesheet" href="style.css?v=58">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="Logo.ico" alt="" width="24" height="24"><span>GridStar Agent</span></div>
      <button id="connection" class="connection checking" type="button" title="重新检查连接"><span></span><b>连接中</b></button>
      <div class="theme-switch" id="theme-switch">
        <button id="theme-trigger" class="theme-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" title="切换皮肤"><span class="theme-swatch" aria-hidden="true"></span><span id="theme-label" class="theme-name">深色</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div id="theme-listbox" class="theme-listbox hidden" role="listbox" aria-label="皮肤列表">
          <button type="button" data-theme-opt="dark" class="theme-option" role="option"><i class="sw sw-dark" aria-hidden="true"></i>深色</button>
          <button type="button" data-theme-opt="silver" class="theme-option" role="option"><i class="sw sw-silver" aria-hidden="true"></i>银白</button>
          <button type="button" data-theme-opt="blue" class="theme-option" role="option"><i class="sw sw-blue" aria-hidden="true"></i>蔚蓝</button>
        </div>
      </div>
    </header>

    <section class="sessionbar">
      <button id="new-session" class="primary compact" type="button"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span>新对话</span></button>
      <button id="session-trigger" class="session-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span id="current-title">选择会话</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </section>

    <nav class="view-tabs" role="tablist" aria-label="视图切换">
      <button id="tab-chat" class="view-tab active" type="button" role="tab" aria-selected="true">对话</button>
      <button id="tab-trajectory" class="view-tab" type="button" role="tab" aria-selected="false">轨迹</button>
    </nav>

    <div id="session-panel" class="session-panel hidden" role="dialog" aria-label="会话历史">
      <div class="panel-head">
        <input id="session-search" type="search" placeholder="搜索会话" aria-label="搜索会话">
        <button id="close-sessions" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </div>

    <section id="messages" class="messages" aria-live="polite">
      <div id="welcome" class="empty-state">
        <div class="empty-symbol">⌁</div>
        <strong>对话已就绪</strong>
        <p>描述你的工程目标，Agent 将按当前模式执行。</p>
      </div>
    </section>

    <nav id="turn-rail" class="turn-rail hidden" aria-label="对话轮次导航"></nav>
    <div id="turn-rail-panel" class="turn-rail-panel" aria-label="对话轮次列表">
      <div class="turn-rail-panel-head"><span>对话轮次</span><b id="turn-rail-count"></b></div>
      <div id="turn-rail-list" class="turn-rail-list"></div>
    </div>

    <section id="trajectory-view" class="trajectory-view hidden" aria-label="轨迹视图">
      <div class="traj-toolbar">
        <div class="traj-views" role="group" aria-label="轨迹分组">
          <button type="button" data-traj-metric aria-pressed="false" title="正在按等宽操作展示；点击切到实际时长">时长</button>
          <button type="button" data-traj-view="turn" aria-pressed="false" title="点击按轮次分组显示">轮次</button>
          <button type="button" data-traj-view="call" aria-pressed="false" title="点击按模型调用分组显示">调用</button>
        </div>
        <input id="traj-search" type="search" placeholder="搜索轨迹" aria-label="搜索轨迹">
      </div>
      <div id="traj-timeline" class="traj-timeline" aria-label="时间轴概览"></div>
      <div class="traj-body">
        <div id="traj-ledger" class="traj-ledger" role="list"></div>
        <aside id="traj-inspector" class="traj-inspector hidden" aria-label="记录详情"></aside>
      </div>
    </section>

    <section id="phase-panel" class="phase-panel hidden" aria-live="polite"></section>

    <footer class="composer">
      <div id="config-warning" class="config-warning hidden">后端尚未配置模型，聊天暂不可用。</div>
      <div class="input-wrap">
        <div id="attach-bar" class="attach-bar hidden" aria-label="已添加附件"></div>
        <textarea id="message-input" rows="1" placeholder="输入任务...按Enter发送，Shift+Enter换行" aria-label="消息"></textarea>
        <div class="controls">
          <button id="attach-btn" class="attach" type="button" aria-label="添加附件" title="添加附件">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <div class="mode-switch" role="group" aria-label="交互模式">
            <button type="button" data-mode="manual" class="active">手动</button>
            <button type="button" data-mode="auto">自动</button>
          </div>
          <div class="model-control" title="模型">
            <div class="model-combobox">
              <input id="model-select" type="hidden" value="">
              <button id="model-trigger" type="button" role="combobox" aria-label="模型" aria-haspopup="listbox" aria-expanded="false"><span id="model-label">未配置</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
              <div id="model-listbox" class="model-listbox hidden" role="listbox" aria-label="按供应商分组的模型"></div>
            </div>
          </div>
          <div class="model-control skill-control" title="Skill">
            <div class="model-combobox">
              <input id="skill-select" type="hidden" value="">
              <button id="skill-trigger" type="button" role="combobox" aria-label="Skill" aria-haspopup="listbox" aria-expanded="false"><span id="skill-label">无 Skill</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
              <div id="skill-listbox" class="model-listbox hidden" role="listbox" aria-label="Skill 列表"></div>
            </div>
          </div>
          <span id="busy-label" class="busy-label"></span>
          <button id="open-settings" class="settings-button" type="button" aria-label="打开设置" title="打开设置">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="voice-btn" class="voice" type="button" aria-label="语音输入" title="语音输入" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button id="send" class="send" type="button" aria-label="发送" title="发送">
            <svg class="send-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </button>
          <input id="file-input" class="file-input" type="file" multiple aria-label="选择附件">
        </div>
      </div>
      <div id="choice-overlay" class="choice-overlay hidden" aria-live="polite"></div>
    </footer>
    <div id="drop-overlay" class="drop-overlay hidden"><span>松开以添加附件</span></div>
    <div id="toast" class="toast hidden" role="status"></div>
  </main>

  <div id="settings-modal" class="modal-backdrop hidden">
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-head"><div><span class="eyebrow">CONFIGURATION</span><h2 id="settings-title">设置中心</h2></div><button id="close-settings" class="icon-button" type="button" aria-label="关闭设置">×</button></header>
      <div class="settings-tabs" role="tablist" aria-label="设置分类">
        <button id="tab-models" type="button" role="tab" aria-selected="true" aria-controls="panel-models" data-settings-tab="models">模型</button>
        <button id="tab-skills" type="button" role="tab" aria-selected="false" aria-controls="panel-skills" data-settings-tab="skills">技能</button>
        <button id="tab-mcp" type="button" role="tab" aria-selected="false" aria-controls="panel-mcp" data-settings-tab="mcp">MCP 工具</button>
        <button id="tab-usage" type="button" role="tab" aria-selected="false" aria-controls="panel-usage" data-settings-tab="usage">用量</button>
      </div>
      <div class="settings-content">
        <div id="panel-models" class="settings-panel models-panel" role="tabpanel" aria-labelledby="tab-models">
          <aside class="provider-sidebar"><div class="section-label">供应商</div><nav id="provider-list" aria-label="供应商列表"></nav><button id="add-provider" class="secondary wide" type="button">＋ 添加供应商</button></aside>
          <div id="provider-editor" class="provider-editor"></div>
        </div>
        <div id="panel-skills" class="settings-panel skills-panel hidden" role="tabpanel" aria-labelledby="tab-skills">
          <div class="skills-toolbar"><div><span class="eyebrow">SKILLS</span><h3>技能 <small id="skill-count">0</small></h3></div><button id="refresh-skills" class="secondary" type="button">刷新</button></div>
          <div id="skills-status" class="skills-status" role="status" aria-live="polite"></div>
          <div id="skills-list" class="skills-list"></div>
        </div>
        <div id="panel-mcp" class="settings-panel mcp-panel hidden" role="tabpanel" aria-labelledby="tab-mcp">
          <div class="mcp-toolbar"><div><span class="eyebrow">MCP TOOLS</span><h3>MCP 工具 <small id="mcp-count">0</small></h3></div><button id="refresh-mcp" class="secondary" type="button">刷新</button></div>
          <div id="mcp-status" class="mcp-status" role="status" aria-live="polite"></div>
          <div id="mcp-tools" class="mcp-tools"></div>
        </div>
        <div id="panel-usage" class="settings-panel usage-panel hidden" role="tabpanel" aria-labelledby="tab-usage">
          <div class="usage-filters">
            <div class="usage-filter">
              <span class="usage-filter-label">分组</span>
              <button id="usage-group" class="usage-select" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="usage-group-label">模型用量</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
              <div id="usage-group-list" class="usage-listbox hidden" role="listbox" aria-label="分组维度"></div>
            </div>
            <div class="usage-filter">
              <span class="usage-filter-label">供应商</span>
              <button id="usage-provider" class="usage-select" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="usage-provider-label">全部供应商</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
              <div id="usage-provider-list" class="usage-listbox hidden" role="listbox" aria-label="供应商"></div>
            </div>
            <div class="usage-filter">
              <span class="usage-filter-label">模型</span>
              <button id="usage-model" class="usage-select" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="usage-model-label">全部模型</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
              <div id="usage-model-list" class="usage-listbox hidden" role="listbox" aria-label="模型"></div>
            </div>
            <div class="usage-filter">
              <span class="usage-filter-label">粒度</span>
              <button id="usage-granularity" class="usage-select" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="usage-granularity-label">按天</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
              <div id="usage-granularity-list" class="usage-listbox hidden" role="listbox" aria-label="时间粒度"></div>
            </div>
            <div class="usage-filter usage-range-filter">
              <span class="usage-filter-label">日期</span>
              <button id="usage-range" class="usage-select" type="button" aria-haspopup="dialog" aria-expanded="false"><svg class="usage-cal-icon" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span id="usage-range-label">最近 7 天</span><svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
            <button id="usage-refresh" class="secondary" type="button">刷新</button>
            <!-- 日历面板挂在筛选行下（不是日期触发器内）：它宽约 560，跟着触发器左缘向右展开会顶出弹窗右缘被裁掉 -->
            <div id="usage-range-panel" class="usage-range-panel hidden" role="dialog" aria-label="选择时间范围">
              <div id="usage-calendar" class="usage-calendar"></div>
              <div id="usage-range-presets" class="usage-range-presets"></div>
            </div>
          </div>
          <div id="usage-status" class="usage-status" role="status" aria-live="polite"></div>
          <div id="usage-overview" class="usage-overview"></div>
          <div class="usage-card">
            <div class="usage-card-head"><div><span class="eyebrow">TREND</span><h4>输入 / 输出趋势</h4></div><em>滚轮缩放 · 拖拽平移 · 双击复位 · Shift + 滚轮缩放纵轴</em></div>
            <div id="usage-line" class="usage-chart"></div>
          </div>
          <div class="usage-grid">
            <div class="usage-card">
              <div class="usage-card-head"><div><span class="eyebrow">SHARE</span><h4 id="usage-pie-title">模型占比</h4></div></div>
              <div id="usage-pie" class="usage-chart"></div>
            </div>
            <div class="usage-card">
              <div class="usage-card-head"><div><span class="eyebrow">MEASURED</span><h4>实测 vs 估算</h4></div></div>
              <div id="usage-bar" class="usage-chart"></div>
            </div>
          </div>
          <div class="usage-card">
            <div class="usage-card-head"><div><span class="eyebrow">DETAIL</span><h4 id="usage-table-title">模型明细</h4></div></div>
            <div id="usage-table" class="usage-table-wrap"></div>
          </div>
          <div id="usage-live" class="usage-live" aria-live="polite"></div>
        </div>
      </div>
      <footer class="settings-actions"><span id="settings-status" role="status" aria-live="polite"></span><button id="cancel-settings" class="secondary" type="button">取消</button><button id="save-settings" class="primary" type="button">保存设置</button></footer>
    </section>
  </div>
  <script src="charts.js?v=5" defer></script>
  <script src="app.js?v=73" defer></script>
</body>
</html>
