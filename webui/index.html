<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridStar AI</title>
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">GS</span><span>GRIDSTAR AI</span></div>
      <button id="connection" class="connection checking" type="button" title="重新检查连接"><span></span><b>连接中</b></button>
    </header>

    <section class="sessionbar">
      <button id="new-session" class="primary compact" type="button">＋ <span>新对话</span></button>
      <button id="session-trigger" class="session-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span id="current-title">选择会话</span><span>⌄</span>
      </button>
    </section>

    <div id="session-panel" class="session-panel hidden" role="dialog" aria-label="会话历史">
      <div class="panel-head">
        <input id="session-search" type="search" placeholder="搜索会话" aria-label="搜索会话">
        <button id="close-sessions" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </div>

    <section id="messages" class="messages" aria-live="polite">
      <div id="welcome" class="empty-state">
        <div class="empty-symbol">⌁</div>
        <strong>对话已就绪</strong>
        <p>描述你的工程目标，Agent 将按当前模式执行。</p>
      </div>
    </section>

    <section id="phase-panel" class="phase-panel hidden" aria-live="polite"></section>

    <footer class="composer">
      <div id="config-warning" class="config-warning hidden">后端尚未配置模型，聊天暂不可用。</div>
      <div class="controls">
        <div class="mode-switch" role="group" aria-label="交互模式">
          <button type="button" data-mode="manual" class="active">MANUAL</button>
          <button type="button" data-mode="auto">AUTO</button>
        </div>
        <div class="model-control" title="模型">
          <span>模型</span>
          <div class="model-combobox">
            <input id="model-select" type="hidden" value="">
            <button id="model-trigger" type="button" role="combobox" aria-label="模型" aria-haspopup="listbox" aria-expanded="false"><span id="model-label">未配置</span><span aria-hidden="true">⌄</span></button>
            <div id="model-listbox" class="model-listbox hidden" role="listbox" aria-label="按供应商分组的模型"></div>
          </div>
        </div>
        <div class="model-control skill-control" title="Skill">
          <span>Skill</span>
          <div class="model-combobox">
            <input id="skill-select" type="hidden" value="">
            <button id="skill-trigger" type="button" role="combobox" aria-label="Skill" aria-haspopup="listbox" aria-expanded="false"><span id="skill-label">无 Skill</span><span aria-hidden="true">⌄</span></button>
            <div id="skill-listbox" class="model-listbox hidden" role="listbox" aria-label="Skill 列表"></div>
          </div>
        </div>
        <button id="open-settings" class="settings-button" type="button" aria-label="打开设置" title="打开设置">⚙</button>
      </div>
      <div id="attach-bar" class="attach-bar hidden" aria-label="已添加附件"></div>
      <div class="input-wrap">
        <textarea id="message-input" rows="2" placeholder="输入网格生成或质量检查任务，可拖拽文件到此…" aria-label="消息"></textarea>
        <button id="attach-btn" class="attach" type="button" aria-label="添加附件" title="添加附件">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input id="file-input" class="file-input" type="file" multiple aria-label="选择附件">
        <button id="voice-btn" class="voice" type="button" aria-label="语音输入" title="语音输入" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="send" class="send" type="button" aria-label="发送" title="发送">↑</button>
      </div>
      <div class="composer-foot"><span id="busy-label">Enter 发送 · Shift+Enter 换行</span></div>
    </footer>
    <div id="drop-overlay" class="drop-overlay hidden"><span>松开以添加附件</span></div>
    <div id="toast" class="toast hidden" role="status"></div>
  </main>

  <div id="settings-modal" class="modal-backdrop hidden">
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-head"><div><span class="eyebrow">CONFIGURATION</span><h2 id="settings-title">设置中心</h2></div><button id="close-settings" class="icon-button" type="button" aria-label="关闭设置">×</button></header>
      <div class="settings-tabs" role="tablist" aria-label="设置分类">
        <button id="tab-models" type="button" role="tab" aria-selected="true" aria-controls="panel-models" data-settings-tab="models">模型</button>
        <button id="tab-skills" type="button" role="tab" aria-selected="false" aria-controls="panel-skills" data-settings-tab="skills">技能</button>
        <button id="tab-mcp" type="button" role="tab" aria-selected="false" aria-controls="panel-mcp" data-settings-tab="mcp">MCP 工具</button>
      </div>
      <div class="settings-content">
        <div id="panel-models" class="settings-panel models-panel" role="tabpanel" aria-labelledby="tab-models">
          <aside class="provider-sidebar"><div class="section-label">供应商</div><nav id="provider-list" aria-label="供应商列表"></nav><button id="add-provider" class="secondary wide" type="button">＋ 添加供应商</button></aside>
          <div id="provider-editor" class="provider-editor"></div>
        </div>
        <div id="panel-skills" class="settings-panel skills-panel hidden" role="tabpanel" aria-labelledby="tab-skills">
          <div class="skills-toolbar"><div><span class="eyebrow">SKILLS</span><h3>技能 <small id="skill-count">0</small></h3></div><button id="refresh-skills" class="secondary" type="button">刷新</button></div>
          <div id="skills-status" class="skills-status" role="status" aria-live="polite"></div>
          <div id="skills-list" class="skills-list"></div>
        </div>
        <div id="panel-mcp" class="settings-panel mcp-panel hidden" role="tabpanel" aria-labelledby="tab-mcp">
          <div class="mcp-toolbar"><div><span class="eyebrow">MCP TOOLS</span><h3>MCP 工具 <small id="mcp-count">0</small></h3></div><button id="refresh-mcp" class="secondary" type="button">刷新</button></div>
          <div id="mcp-status" class="mcp-status" role="status" aria-live="polite"></div>
          <div id="mcp-tools" class="mcp-tools"></div>
        </div>
      </div>
      <footer class="settings-actions"><span id="settings-status" role="status" aria-live="polite"></span><button id="cancel-settings" class="secondary" type="button">取消</button><button id="save-settings" class="primary" type="button">保存设置</button></footer>
    </section>
  </div>
  <script src="app.js?v=24" defer></script>
</body>
</html>
